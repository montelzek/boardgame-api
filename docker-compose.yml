services:
  app:
    container_name: boardgame-app
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/boardgames?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: boardgame-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: boardgames
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data: